[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipagent"
version = "0.1.0"
description = "Agent IA de clipping vidéo : sélection des moments forts + rendu vertical sous-titré"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Oussama Kaddech" }]
keywords = ["ai", "agent", "video", "clipping", "highlights", "ffmpeg", "openai-agents"]
dependencies = [
    "openai-agents>=0.0.9",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0", "av<16"]
download = ["yt-dlp>=2025.1"]
# 1.49.1 = version de Chromium déjà présente sur ce poste (chromium-1148)
browser = ["playwright==1.49.1"]
dev = ["pytest>=8.0", "imageio-ffmpeg>=0.5", "faster-whisper>=1.0", "av<16", "yt-dlp>=2025.1", "playwright==1.49.1"]

[project.scripts]
clipagent = "clipagent.cli:main"

[tool.setuptools]
packages = ["clipagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
