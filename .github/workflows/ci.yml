name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Contrôle statique (pyflakes)
        run: |
          pip install pyflakes
          pyflakes $(git ls-files '*.py')

      - name: Tests
        run: pytest -q

  packaging:
    name: Construction du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Vérifier les artefacts
        run: ls -lh dist/

  ffmpeg-check:
    name: Rendu de bout en bout (ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg + imageio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install imageio-ffmpeg
      - name: Rendu d'un extrait de démonstration
        run: |
          python -m pip install -e ".[dev]"
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          from clipagent.config import Settings
          from clipagent.ffmpeg import render_clip
          from clipagent.styles import STYLES
          import subprocess, shutil

          ffmpeg = shutil.which("ffmpeg") or __import__("imageio_ffmpeg").get_ffmpeg_exe()
          source = Path("output/_ci_source.mp4")
          subprocess.run([ffmpeg, "-y", "-hide_banner", "-loglevel", "error",
                          "-f", "lavfi", "-i", "testsrc=size=1280x720:rate=25:duration=6",
                          "-c:v", "libx264", "-pix_fmt", "yuv420p", str(source)], check=True)
          out = Path("output/_ci_clip.mp4")
          render_clip(source, out, start=1, end=5, settings=Settings.from_env(), style=STYLES["tiktok"])
          assert out.exists() and out.stat().st_size > 1000, "rendu vide"
          print("OK : rendu ffmpeg", out.stat().st_size, "octets")
          PY
